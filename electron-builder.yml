# Desktop packaging. Run via `yarn electron:build`. Unsigned, no auto-update.
appId: io.github.denisyu-1.redisdeck
productName: Redis Deck
directories:
    output: dist-electron
files:
    - package.json
    - server.js
    - electron/**
    - config/**
    - guards/**
    - routes/**
    - services/**
    - public/**
    - dist/**
    - client/plugins/config/**
# better-sqlite3 is rebuilt against Electron's ABI by electron-builder (npmRebuild).
npmRebuild: true
# Bundled redis-cli (+ its OpenSSL libs) from scripts/build-redis-cli.sh.
extraResources:
    - from: build/redis-cli
      to: redis-cli
      filter:
          - '**/*'
          - '!.stamp'
mac:
    target:
        - dmg
    icon: electron/icon.png
    category: public.app-category.developer-tools
    # Ad-hoc sign: Apple Silicon reports fully unsigned apps as "damaged". No Developer ID, so users still xattr -cr once.
    identity: '-'
    hardenedRuntime: false
dmg:
    title: Redis Deck
    artifactName: Redis-Deck-${version}-${arch}.${ext}
linux:
    target:
        - AppImage
    executableName: redis-deck
    icon: electron/icon.png
    category: Development
