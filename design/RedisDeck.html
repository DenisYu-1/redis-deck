<!doctype html>
<html>
    <head>
        <meta charset="utf8" />
        <meta
            name="viewport"
            content="width=device-width,initial-scale=1,viewport-fit=cover"
        />
        <style>
            :root {
                color-scheme: light;
                box-sizing: border-box;
                padding-top: env(safe-area-inset-top, 0px);
                padding-bottom: env(safe-area-inset-bottom, 0px);
            }
            html {
                scroll-padding-top: env(safe-area-inset-top, 0px);
            }
            body {
                margin: 0;
                padding: 0;
                font:
                    14px -apple-system,
                    BlinkMacSystemFont,
                    sans-serif;
                background: #fff;
                color: #000;
            }
            img {
                max-width: 100%;
            }
            [hidden]:not([hidden='until-found' i]) {
                display: none !important;
            }
        </style>
    </head>
    <body>
        <title>RedisDeck</title>
        <meta name="claude:viewport-fit-sides" content="cover" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link
            rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap"
        />
        <style>
            /* Layout: framed desktop-app shell — sidebar + working area; panes scroll inside, stack on phones */
            :root {
                --f-ui:
                    'Geist', 'Inter', system-ui, -apple-system, 'Segoe UI',
                    sans-serif;
                --f-mono:
                    'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo,
                    Consolas, monospace;
                --bg: #0d0e10;
                --sf: #131518;
                --r2: #1a1d21;
                --hv: #22262c;
                --bd: #262a30;
                --bd2: #363b43;
                --grid: #1e2126;
                --tx: #e7e9ec;
                --tx2: #b4b9c1;
                --mu: #868c95;
                --ac: #ff6b5f;
                --acs: rgba(255, 107, 95, 0.13);
                --btn: #d93a30;
                --ok: #4ade80;
                --okS: rgba(74, 222, 128, 0.12);
                --warn: #fbbf24;
                --warnS: rgba(251, 191, 36, 0.13);
                --info: #7db3ff;
                --infoS: rgba(125, 179, 255, 0.13);
                --code: #0f1113;
                --c1: #4a8ae8;
                --c2: #da7232;
                --sparkFill: rgba(74, 138, 232, 0.14);
                --str: #8fd56b;
                --num: #7db3ff;
                --kw: #c3a6ff;
                --t-string: #7db3ff;
                --t-hash: #b79cff;
                --t-list: #5ed3c3;
                --t-set: #f2c25b;
                --t-zset: #ff9f66;
                --t-stream: #f38bc0;
                --t-json: #8fd56b;
                --shadow: rgba(0, 0, 0, 0.5);
                --dot: #1c1f23;
                color-scheme: dark;
            }
            @media (prefers-color-scheme: light) {
                :root:not([data-theme='dark']) {
                    --bg: #f3f4f6;
                    --sf: #ffffff;
                    --r2: #f4f5f7;
                    --hv: #e9ecef;
                    --bd: #e2e4e8;
                    --bd2: #cdd1d7;
                    --grid: #eef0f2;
                    --tx: #15171b;
                    --tx2: #3d424a;
                    --mu: #5f656e;
                    --ac: #c4302a;
                    --acs: rgba(217, 58, 48, 0.09);
                    --btn: #d93a30;
                    --ok: #15803d;
                    --okS: rgba(21, 128, 61, 0.09);
                    --warn: #b45309;
                    --warnS: rgba(180, 83, 9, 0.1);
                    --info: #1d5fbf;
                    --infoS: rgba(29, 95, 191, 0.09);
                    --code: #f7f8fa;
                    --c1: #1d5fbf;
                    --c2: #c2540f;
                    --sparkFill: rgba(29, 95, 191, 0.1);
                    --str: #3f7a12;
                    --num: #1d5fbf;
                    --kw: #6b3fd1;
                    --t-string: #1d5fbf;
                    --t-hash: #6b3fd1;
                    --t-list: #0f7a6c;
                    --t-set: #8a6100;
                    --t-zset: #b4490f;
                    --t-stream: #b0306f;
                    --t-json: #3f7a12;
                    --shadow: rgba(20, 24, 30, 0.14);
                    --dot: #dde0e4;
                    color-scheme: light;
                }
            }
            :root[data-theme='light'] {
                --bg: #f3f4f6;
                --sf: #ffffff;
                --r2: #f4f5f7;
                --hv: #e9ecef;
                --bd: #e2e4e8;
                --bd2: #cdd1d7;
                --grid: #eef0f2;
                --tx: #15171b;
                --tx2: #3d424a;
                --mu: #5f656e;
                --ac: #c4302a;
                --acs: rgba(217, 58, 48, 0.09);
                --btn: #d93a30;
                --ok: #15803d;
                --okS: rgba(21, 128, 61, 0.09);
                --warn: #b45309;
                --warnS: rgba(180, 83, 9, 0.1);
                --info: #1d5fbf;
                --infoS: rgba(29, 95, 191, 0.09);
                --code: #f7f8fa;
                --c1: #1d5fbf;
                --c2: #c2540f;
                --sparkFill: rgba(29, 95, 191, 0.1);
                --str: #3f7a12;
                --num: #1d5fbf;
                --kw: #6b3fd1;
                --t-string: #1d5fbf;
                --t-hash: #6b3fd1;
                --t-list: #0f7a6c;
                --t-set: #8a6100;
                --t-zset: #b4490f;
                --t-stream: #b0306f;
                --t-json: #3f7a12;
                --shadow: rgba(20, 24, 30, 0.14);
                --dot: #dde0e4;
                color-scheme: light;
            }
            :root[data-theme='dark'] {
                --bg: #0d0e10;
                --sf: #131518;
                --r2: #1a1d21;
                --hv: #22262c;
                --bd: #262a30;
                --bd2: #363b43;
                --grid: #1e2126;
                --tx: #e7e9ec;
                --tx2: #b4b9c1;
                --mu: #868c95;
                --ac: #ff6b5f;
                --acs: rgba(255, 107, 95, 0.13);
                --btn: #d93a30;
                --ok: #4ade80;
                --okS: rgba(74, 222, 128, 0.12);
                --warn: #fbbf24;
                --warnS: rgba(251, 191, 36, 0.13);
                --info: #7db3ff;
                --infoS: rgba(125, 179, 255, 0.13);
                --code: #0f1113;
                --c1: #4a8ae8;
                --c2: #da7232;
                --sparkFill: rgba(74, 138, 232, 0.14);
                --str: #8fd56b;
                --num: #7db3ff;
                --kw: #c3a6ff;
                --t-string: #7db3ff;
                --t-hash: #b79cff;
                --t-list: #5ed3c3;
                --t-set: #f2c25b;
                --t-zset: #ff9f66;
                --t-stream: #f38bc0;
                --t-json: #8fd56b;
                --shadow: rgba(0, 0, 0, 0.5);
                --dot: #1c1f23;
                color-scheme: dark;
            }
            html,
            body {
                height: 100%;
            }
            body {
                background: var(--bg);
                color: var(--tx);
                font-family: var(--f-ui);
                font-size: 13px;
                line-height: 1.45;
                box-sizing: border-box;
                padding-left: max(16px, env(safe-area-inset-left, 0px));
                padding-right: max(16px, env(safe-area-inset-right, 0px));
                padding-block: 16px;
                -webkit-font-smoothing: antialiased;
            }
            *,
            *::before,
            *::after {
                box-sizing: border-box;
            }
            button,
            input,
            select,
            textarea {
                font: inherit;
                color: inherit;
            }
            button {
                cursor: pointer;
            }
            button:disabled {
                cursor: not-allowed;
                opacity: 0.5;
            }
            :focus-visible {
                outline: 2px solid var(--ac);
                outline-offset: 1px;
            }
            a {
                color: inherit;
            }
            .mono {
                font-family: var(--f-mono);
            }
            .xs {
                font-size: 11px;
            }
            .sm {
                font-size: 12px;
            }
            .mu {
                color: var(--mu);
            }
            .tx2 {
                color: var(--tx2);
            }
            .ellip {
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
            }
            .sr {
                position: absolute;
                width: 1px;
                height: 1px;
                overflow: hidden;
                clip: rect(0 0 0 0);
                white-space: nowrap;
            }
            .tab {
                font-variant-numeric: tabular-nums;
            }
            svg {
                flex: none;
            }

            /* ---------- shell ---------- */
            .app {
                height: 100%;
                display: grid;
                grid-template-columns: 236px minmax(0, 1fr);
                border: 1px solid var(--bd);
                border-radius: 12px;
                overflow: hidden;
                background: var(--bg);
                box-shadow: 0 20px 60px var(--shadow);
            }
            .app.bare {
                grid-template-columns: minmax(0, 1fr);
            }
            .app.bare .side {
                display: none;
            }
            .side {
                background: var(--sf);
                border-right: 1px solid var(--bd);
                display: flex;
                flex-direction: column;
                gap: 14px;
                padding: 14px 10px 10px;
                overflow: auto;
                min-height: 0;
            }
            .main {
                display: flex;
                flex-direction: column;
                min-width: 0;
                min-height: 0;
                overflow: hidden;
            }
            .brand {
                display: flex;
                align-items: center;
                gap: 9px;
                padding: 0 6px;
                font-weight: 600;
                font-size: 15px;
                letter-spacing: -0.01em;
            }
            .brand b {
                color: var(--ac);
                font-weight: 600;
            }
            .connwrap {
                position: relative;
            }
            .connbtn {
                display: flex;
                align-items: center;
                gap: 10px;
                width: 100%;
                padding: 9px 10px;
                background: var(--r2);
                border: 1px solid var(--bd);
                border-radius: 8px;
                text-align: left;
            }
            .connbtn:hover {
                border-color: var(--bd2);
            }
            .connmeta {
                display: flex;
                flex-direction: column;
                min-width: 0;
                flex: 1;
            }
            .connname {
                display: flex;
                align-items: center;
                gap: 6px;
                font-weight: 500;
            }
            .dot {
                width: 8px;
                height: 8px;
                border-radius: 50%;
                background: var(--ok);
                flex: none;
            }
            .menu {
                position: absolute;
                left: 0;
                right: 0;
                top: calc(100% + 4px);
                z-index: 20;
                background: var(--sf);
                border: 1px solid var(--bd2);
                border-radius: 10px;
                box-shadow: 0 12px 32px var(--shadow);
                padding: 4px;
                display: flex;
                flex-direction: column;
            }
            .menu button,
            .menu a {
                display: flex;
                align-items: center;
                gap: 8px;
                padding: 7px 8px;
                border: 0;
                background: none;
                border-radius: 6px;
                text-align: left;
                text-decoration: none;
                color: var(--tx);
            }
            .menu button:hover,
            .menu a:hover {
                background: var(--hv);
            }
            .menu hr {
                border: 0;
                border-top: 1px solid var(--bd);
                margin: 4px 0;
            }
            .navgroup {
                display: flex;
                flex-direction: column;
                gap: 1px;
            }
            .navhead {
                display: flex;
                align-items: center;
                justify-content: space-between;
                padding: 0 4px 4px 10px;
                font-size: 11px;
                font-weight: 500;
                letter-spacing: 0.06em;
                text-transform: uppercase;
                color: var(--mu);
                min-height: 24px;
            }
            .navitem {
                display: flex;
                align-items: center;
                gap: 10px;
                padding: 7px 10px;
                border-radius: 6px;
                color: var(--tx2);
                text-decoration: none;
                border: 0;
                background: none;
                width: 100%;
                text-align: left;
            }
            .navitem:hover {
                background: var(--hv);
                color: var(--tx);
            }
            .navitem.on {
                background: var(--acs);
                color: var(--tx);
                font-weight: 500;
            }
            .navitem.on svg {
                color: var(--ac);
            }
            .navitem .count {
                margin-left: auto;
                font-family: var(--f-mono);
                font-size: 11px;
                color: var(--mu);
                font-weight: 400;
            }
            .subitem {
                display: block;
                padding: 5px 10px 5px 36px;
                border-radius: 6px;
                color: var(--tx2);
                text-decoration: none;
            }
            .subitem:hover {
                background: var(--hv);
            }
            .subitem.on {
                background: var(--acs);
                color: var(--tx);
                font-weight: 500;
            }
            .saved {
                display: flex;
                flex-direction: column;
                gap: 1px;
                padding: 6px 10px;
                border: 0;
                background: none;
                border-radius: 6px;
                text-align: left;
                width: 100%;
            }
            .saved:hover {
                background: var(--hv);
            }
            .saved .pat {
                font-family: var(--f-mono);
                font-size: 11px;
                color: var(--mu);
            }
            .iconbtn {
                width: 30px;
                height: 30px;
                display: grid;
                place-items: center;
                background: none;
                border: 1px solid var(--bd);
                border-radius: 6px;
                color: var(--tx2);
            }
            .iconbtn:hover:not(:disabled) {
                background: var(--hv);
                color: var(--tx);
            }
            .iconbtn.danger {
                color: var(--ac);
            }
            .iconbtn.ghost {
                border-color: transparent;
            }
            .sidefoot {
                margin-top: auto;
                display: flex;
                flex-direction: column;
                gap: 8px;
            }
            .seg {
                display: flex;
                padding: 3px;
                background: var(--r2);
                border: 1px solid var(--bd);
                border-radius: 8px;
            }
            .seg button {
                flex: 1;
                height: 26px;
                border: 0;
                border-radius: 5px;
                background: none;
                color: var(--tx2);
                font-size: 12px;
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 5px;
            }
            .seg button[aria-checked='true'],
            .seg button[aria-pressed='true'] {
                background: var(--sf);
                color: var(--tx);
                box-shadow: 0 1px 2px var(--shadow);
            }
            .status {
                display: flex;
                align-items: center;
                gap: 8px;
                padding: 8px 10px 2px;
                border-top: 1px solid var(--bd);
                color: var(--mu);
            }

            /* ---------- common controls ---------- */
            .btn {
                height: 32px;
                display: inline-flex;
                align-items: center;
                justify-content: center;
                gap: 6px;
                padding: 0 12px;
                background: var(--sf);
                border: 1px solid var(--bd2);
                border-radius: 7px;
                color: var(--tx2);
                font-size: 12.5px;
                text-decoration: none;
                white-space: nowrap;
            }
            .btn:hover:not(:disabled) {
                background: var(--hv);
                color: var(--tx);
            }
            .btn.primary {
                background: var(--btn);
                border-color: var(--btn);
                color: #fff;
                font-weight: 500;
            }
            .btn.primary:hover:not(:disabled) {
                background: #c2332a;
                color: #fff;
            }
            .btn.danger {
                background: none;
                border-color: var(--ac);
                color: var(--ac);
            }
            .btn.sm {
                height: 28px;
                padding: 0 10px;
                font-size: 12px;
            }
            .btn.xs {
                height: 24px;
                padding: 0 8px;
                font-size: 11.5px;
            }
            .field {
                display: flex;
                flex-direction: column;
                gap: 5px;
                font-size: 12px;
                font-weight: 500;
            }
            .field .hint {
                font-weight: 400;
                color: var(--mu);
            }
            .field .err {
                font-weight: 400;
                color: var(--ac);
            }
            .input,
            .select,
            .textarea {
                height: 34px;
                padding: 0 10px;
                background: var(--bg);
                border: 1px solid var(--bd2);
                border-radius: 7px;
                font-size: 13px;
                font-weight: 400;
                width: 100%;
                min-width: 0;
            }
            .textarea {
                height: auto;
                padding: 10px 12px;
                resize: vertical;
                line-height: 1.6;
            }
            .input.mono,
            .textarea.mono {
                font-family: var(--f-mono);
                font-size: 12.5px;
            }
            .input.bad {
                border-color: var(--ac);
            }
            .input:focus,
            .select:focus,
            .textarea:focus {
                outline: none;
                border-color: var(--ac);
                box-shadow: 0 0 0 3px var(--acs);
            }
            .badge {
                display: inline-block;
                font-family: var(--f-mono);
                font-size: 10.5px;
                font-weight: 500;
                padding: 1px 0;
                border-radius: 4px;
                text-align: center;
                width: 56px;
                text-transform: uppercase;
                color: var(--tc);
                background: color-mix(in srgb, var(--tc) 14%, transparent);
            }
            .badge.auto {
                width: auto;
                padding: 2px 7px;
            }
            .b-string {
                --tc: var(--t-string);
            }
            .b-hash {
                --tc: var(--t-hash);
            }
            .b-list {
                --tc: var(--t-list);
            }
            .b-set {
                --tc: var(--t-set);
            }
            .b-zset {
                --tc: var(--t-zset);
            }
            .b-stream {
                --tc: var(--t-stream);
            }
            .b-json {
                --tc: var(--t-json);
            }
            .env {
                font-size: 10.5px;
                font-weight: 500;
                padding: 0 6px;
                border-radius: 4px;
                line-height: 17px;
            }
            .env.local {
                color: var(--tx2);
                background: var(--r2);
                border: 1px solid var(--bd2);
            }
            .env.staging {
                color: var(--warn);
                background: var(--warnS);
            }
            .env.production {
                color: var(--ac);
                background: var(--acs);
            }
            .label {
                font-size: 11px;
                font-weight: 500;
                letter-spacing: 0.06em;
                text-transform: uppercase;
                color: var(--mu);
            }
            .card {
                background: var(--sf);
                border: 1px solid var(--bd);
                border-radius: 10px;
            }
            .check {
                accent-color: #d93a30;
                margin: 0;
                width: 14px;
                height: 14px;
            }
            kbd {
                font-family: var(--f-mono);
                font-size: 11px;
                padding: 1px 6px;
                border: 1px solid var(--bd2);
                border-radius: 4px;
                color: var(--mu);
            }
            .banner {
                display: flex;
                align-items: center;
                gap: 10px;
                padding: 8px 16px;
                background: var(--acs);
                color: var(--ac);
                border-bottom: 1px solid var(--bd);
                font-size: 12.5px;
                font-weight: 500;
            }
            .banner span {
                color: var(--tx2);
                font-weight: 400;
            }
            .viewhead {
                display: flex;
                flex-wrap: wrap;
                align-items: center;
                gap: 10px 14px;
                padding: 14px 20px;
                border-bottom: 1px solid var(--bd);
            }
            .viewhead h1 {
                margin: 0;
                font-size: 17px;
                font-weight: 600;
                letter-spacing: -0.01em;
                text-wrap: balance;
            }
            .scroll {
                flex: 1;
                min-height: 0;
                overflow: auto;
            }

            /* ---------- keys ---------- */
            .toolbar {
                display: flex;
                flex-wrap: wrap;
                align-items: center;
                gap: 8px;
                padding: 12px 16px;
                border-bottom: 1px solid var(--bd);
            }
            .search {
                flex: 1 1 320px;
                display: flex;
                align-items: center;
                gap: 8px;
                height: 34px;
                padding: 0 10px;
                background: var(--sf);
                border: 1px solid var(--bd2);
                border-radius: 7px;
            }
            .search:focus-within {
                border-color: var(--ac);
                box-shadow: 0 0 0 3px var(--acs);
            }
            .search input {
                flex: 1;
                min-width: 0;
                background: none;
                border: 0;
                outline: none;
                font-family: var(--f-mono);
                font-size: 13px;
            }
            .chips {
                display: flex;
                flex-wrap: wrap;
                align-items: center;
                gap: 6px 14px;
                padding: 8px 16px;
                border-bottom: 1px solid var(--bd);
            }
            .chip {
                height: 24px;
                padding: 0 9px;
                border-radius: 12px;
                border: 1px solid var(--bd);
                background: none;
                color: var(--tx2);
                font-family: var(--f-mono);
                font-size: 12px;
            }
            .chip:hover {
                border-color: var(--bd2);
                color: var(--tx);
            }
            .chip.on {
                color: var(--tc, var(--tx));
                border-color: color-mix(
                    in srgb,
                    var(--tc, var(--tx)) 45%,
                    transparent
                );
                background: color-mix(
                    in srgb,
                    var(--tc, var(--tx)) 13%,
                    transparent
                );
            }
            .panes {
                flex: 1;
                min-height: 0;
                display: grid;
                grid-template-columns: minmax(360px, 1fr) minmax(0, 1.15fr);
            }
            .klist {
                display: flex;
                flex-direction: column;
                min-height: 0;
                border-right: 1px solid var(--bd);
            }
            .khead {
                display: flex;
                align-items: center;
                gap: 8px;
                padding: 8px 12px 8px 16px;
                border-bottom: 1px solid var(--bd);
                font-size: 11px;
                text-transform: uppercase;
                letter-spacing: 0.05em;
                color: var(--mu);
            }
            .cols {
                display: contents;
            }
            .c-type {
                width: 58px;
                text-align: center;
            }
            .c-ttl {
                width: 66px;
                text-align: right;
            }
            .c-size {
                width: 60px;
                text-align: right;

                border-bottom: 1px solid var(--bd);

            .meta {

            .meta div {
                display: flex;

                padding: 7px 10px;

                border: 1px solid var(--bd);

            }
            .meta dt {
                font-size: 11px;
                color: var(--mu);

            }
            .meta dd {
                margin: 0;

                font-size: 12.5px;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }
            .meta dt button {

            .dtools {
                display: flex;

            .vtable {

            .vtable th:first-child,

            .vtable th:last-child,

            .fmt {

                font-size: 10.5px;

            .ibody .k {

            }
            .ibody .t {

            }
            .ibody .s {
                color: var(--str);
            }
            .ibody .n {

            .ibody .b {

            .ibody .dim {

            .segs {

                color: var(--tx2);

            /* ---------- stats ---------- */
            .board {
                padding: 16px 20px 24px;
                display: flex;
                flex-direction: column;
                gap: 12px;
            }

                grid-template-columns: repeat(

                gap: 12px;

            .tile {

                gap: 6px;

                letter-spacing: -0.02em;

                color: var(--mu);
            }
            .tile .foot {

                flex-direction: column;
                gap: 2px;
                font-size: 11px;
                color: var(--mu);
                min-width: 0;
            }

                font-family: var(--f-mono);
                font-size: 10.5px;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }
            .tile.warn {
                border-color: color-mix(in srgb, var(--warn) 50%, var(--bd));

                align-items: center;
                gap: 4px;
                font-size: 11px;
                font-weight: 500;

                color: var(--warn);
            }
            .state.c {
                color: var(--ac);
            }
            .wrow {
                display: flex;
                flex-wrap: wrap;
                gap: 12px;
            }
            .widget {
                flex: 1 1 380px;
                min-width: 0;
                background: var(--sf);
                border: 1px solid var(--bd);
                border-radius: 10px;
                padding: 14px 16px;
                display: flex;
                flex-direction: column;
                gap: 10px;
                position: relative;
            }
            .widget.wide {
                flex: 2 1 560px;
            }
            .whead {
                display: flex;
                flex-wrap: wrap;
                align-items: center;
                gap: 6px 12px;
            }
            .whead h2 {
                margin: 0;
                font-size: 13px;
                font-weight: 600;
            }
            .whead code {
                font-family: var(--f-mono);
                font-size: 11px;
                color: var(--mu);
            }
            .rmw {
                position: absolute;
                top: -8px;
                right: -8px;
                width: 24px;
                height: 24px;
                border-radius: 50%;
                border: 1px solid var(--bd2);
                background: var(--sf);
                color: var(--ac);
                display: grid;
                place-items: center;
                z-index: 2;
            }
            .editing .tile,

                outline: 1px dashed var(--bd2);

                margin-left: 46px;
            }
            .chart svg {
                position: absolute;
                inset: 0;
                width: 100%;
                height: 100%;

                color: var(--mu);

                font-size: 10.5px;

            }

            .cross {

            .sw {

                height: 2px;
                border-radius: 1px;

            }
            .legend {

                gap: 14px;
                font-size: 12px;
                color: var(--tx2);
                margin-left: auto;
            }
            .legend span {
                display: flex;
                align-items: center;
                gap: 6px;
            }
            .note {
                margin: 0;

                align-items: flex-start;
                gap: 8px;
                padding: 8px 10px;
                background: var(--r2);
                border-radius: 7px;
                font-size: 12px;
                color: var(--tx2);

                font-size: 11px;
                color: var(--mu);
                font-weight: 500;
                padding: 4px 0;

                color: var(--tx2);

                height: 12px;

                animation: spin 0.7s linear infinite;

                min-height: 0;
                display: grid;
                grid-template-columns: 280px minmax(0, 1fr) 340px;
            }
            .wsrc {
                border-right: 1px solid var(--bd);
                background: var(--sf);

                flex-direction: column;
                min-height: 0;

            .wlogic {

                flex-direction: column;
                gap: 18px;
                overflow: auto;
                min-height: 0;

            .wprev {
                border-left: 1px solid var(--bd);
                background: var(--sf);
                padding: 14px 18px 18px;
                display: flex;
                flex-direction: column;
                gap: 14px;
                overflow: auto;
                min-height: 0;
            }
            .secbtn {
                display: flex;
                align-items: center;
                gap: 6px;
                width: 100%;
                padding: 8px 8px 4px;
                background: none;
                border: 0;

                font-size: 11.5px;
                color: var(--mu);
                text-align: left;

                transform: rotate(90deg);

                gap: 8px;

                gap: 6px;

                color: var(--tx);

            .thr {

                align-items: center;
                gap: 10px;
                padding: 10px 12px;

                width: 64px;
                height: 28px;

            .codebox {
                margin: 0;
                padding: 10px 12px;
                background: var(--code);
                border: 1px solid var(--bd);
                border-radius: 8px;
                font-family: var(--f-mono);
                font-size: 11px;
                line-height: 1.6;
                color: var(--tx2);

                white-space: pre;

            /* ---------- workflows ---------- */
            .wfgrid {
                display: flex;
                flex-wrap: wrap;
                gap: 20px;

                align-items: flex-start;

                flex-direction: column;
                gap: 16px;

                min-width: 0;
                overflow: hidden;

            }

                gap: 12px;
                padding: 9px 18px;
            }
            .stepn {

                width: 22px;
                height: 22px;
                display: grid;
                place-items: center;
                border-radius: 50%;
                background: var(--r2);
                border: 1px solid var(--bd2);
                font-family: var(--f-mono);
                font-size: 11px;
                color: var(--tx2);

            .tag {

                border-radius: 50%;

                color: var(--ok);
                background: var(--okS);
            }
            .hicon.err {
                color: var(--ac);
                background: var(--acs);

                background: var(--okS);
                color: var(--tx);
            }
            .callout.err {
                background: var(--acs);
                color: var(--tx);
            }
            .callout.warn {
                background: var(--warnS);
                color: var(--tx);
            }

            /* ---------- connections ---------- */
            .cwrap {
                flex: 1;
                min-height: 0;
                display: grid;
                grid-template-columns: minmax(0, 1fr) 420px;
            }

                grid-template-columns: minmax(0, 1fr);
            }
            .ctable {
                width: 100%;
                min-width: 640px;

                background: var(--sf);
                font-size: 12.5px;
            }

                text-align: left;
                font-size: 11px;
                text-transform: uppercase;
                letter-spacing: 0.05em;
                color: var(--mu);
                font-weight: 500;
                padding: 10px 8px;
            }
            .ctable td {
                padding: 10px 8px;
                border-top: 1px solid var(--bd);
                white-space: nowrap;

                background: var(--acs);
            }
            .drawer {
                background: var(--sf);

                /* ================= PHP serialize ================= */
                function phpSer(v) {
                    if (v === null) return 'N;';
                    if (typeof v === 'boolean') return 'b:' + (v ? 1 : 0) + ';';

                        return Number.isInteger(v)
                            ? 'i:' + v + ';'

                        return 's:' + v.length + ':"' + v + '";';

                        'a:' +
                        entries.length +
                        ':{' +
                        entries
                            .map(
                                ([k, x]) =>
                                    (typeof k === 'number'
                                        ? 'i:' + k + ';'
                                        : phpSer(String(k))) + phpSer(x)

                            .join('') +

                        const j = str.indexOf(ch, i);

                        i = j + 1;
                        return out;
                    };
                    function val() {
                        const t = str[i];
                        i += 2;
                        if (t === 'N') {
                            i--;
                            return { t: 'null' };
                        }
                        if (t === 'i') return { t: 'int', v: readUntil(';') };
                        if (t === 'd') return { t: 'float', v: readUntil(';') };
                        if (t === 'b')
                            return { t: 'bool', v: readUntil(';') === '1' };
                        if (t === 's') {
                            const n = +readUntil(':');
                            i++;
                            const s = str.substr(i, n);
                            i += n + 2;
                            return { t: 'string', v: s };
                        }
                        if (t === 'a') {
                            const n = +readUntil(':');
                            i++;
                            const items = [];
                            for (let k = 0; k < n; k++) {
                                const key = val();
                                const v = val();
                                items.push({ k: key, v });
                            }
                            i++;
                            return { t: 'array', n, items };
                        }
                        throw 0;

                        const r = val();

                }
                after.keys = () => {

                function hl(text) {
                    const lit = (S.k.pattern || '')
                        .replace(/[*?\[\]]/g, ' ')
                        .split(' ')
                        .filter((s) => s.length > 1)
                        .sort((a, b) => b.length - a.length)[0];
                    if (!lit) return esc(text);
                    const i = text.toLowerCase().indexOf(lit.toLowerCase());
                    if (i < 0) return esc(text);
                    return (
                        esc(text.slice(0, i)) +
                        '<mark>' +
                        esc(text.slice(i, i + lit.length)) +
                        '</mark>' +
                        esc(text.slice(i + lit.length))
                    );
                }
                function keyRow(k, pad, label, prefix) {
                    const on = S.k.active === k.name,
                        s = S.k.sel.has(k.name);
                    const ttlTxt = fmtTTL(k.exp),
                        soon = k.exp != null && k.exp - nowS() < 300;
                    return `<div class="krow ${on ? 'on' : ''}">
    <input type="checkbox" class="check ksel" data-key="${esc(k.name)}" ${s ? 'checked' : ''} aria-label="Select ${esc(k.name)}">
    <button class="kname" data-action="pick" data-key="${esc(k.name)}" style="padding-left:${pad}px" title="${esc(k.name)}"><span class="pre">${esc(prefix)}</span><span class="leaf">${hl(label)}</span></button>
    <span class="c-type"><span class="badge b-${k.type}">${k.type}</span></span>
    <span class="kv c-ttl ${soon ? 'warnc' : ''}">${ttlTxt}</span>
    <span class="kv c-size">${fmtBytes(k.size)}</span>
  </div>`;

                function renderRows() {
                    const list = filteredKeys();
                    S.k.lastMatched = list;
                    const el = $('#rows');
                    if (!el) return;
                    $('#scanline').textContent =
                        `SCAN COUNT 500 · ${fmtNum(S.keys.length)} / ${fmtNum(S.keys.length)} scanned · ${fmtNum(list.length)} matched · ${S.k.scanMs} ms`;
                    if (!list.length) {
                        el.innerHTML = `<div class="empty"><h3>No keys match <span class="mono">${esc(S.k.pattern)}</span></h3><span class="sm">${S.k.type !== 'all' || S.k.ttl !== 'any' ? 'Type and TTL filters are also applied. ' : ''}Patterns use Redis glob syntax: <span class="mono">*</span>, <span class="mono">?</span>, <span class="mono">[abc]</span>.</span><button class="btn sm" data-action="clear-search">Show all keys</button></div>`;
                        renderSelBar();
                        return;
                    }
                    const out = [];
                    const coll = new Intl.Collator('en', { numeric: true });
                    if (S.k.view === 'list') {
                        const lim = S.k.limit.__flat || 300;
                        list.slice()
                            .sort((a, b) => coll.compare(a.name, b.name))
                            .slice(0, lim)
                            .forEach((k) => {
                                const cut = k.name.lastIndexOf(':');
                                out.push(
                                    keyRow(
                                        k,
                                        0,
                                        cut >= 0
                                            ? k.name.slice(cut + 1)
                                            : k.name,
                                        cut >= 0 ? k.name.slice(0, cut + 1) : ''
                                    )
                                );
                            });
                        if (list.length > lim)
                            out.push(
                                `<div class="morerow" style="padding-left:16px">Showing ${lim} of ${fmtNum(list.length)}<button class="btn xs" data-action="more" data-path="__flat">Show 300 more</button></div>`
                            );
                    } else {
                        const root = {
                            kids: new Map(),
                            keys: [],
                            count: 0,
                            size: 0
                        };
                        for (const k of list) {
                            const segs = k.name.split(':');
                            let node = root;
                            node.count++;
                            node.size += k.size;
                            for (let i = 0; i < segs.length - 1; i++) {
                                const path = segs.slice(0, i + 1).join(':');
                                if (!node.kids.has(segs[i]))
                                    node.kids.set(segs[i], {
                                        name: segs[i],
                                        path,
                                        kids: new Map(),
                                        keys: [],
                                        count: 0,
                                        size: 0
                                    });
                                node = node.kids.get(segs[i]);
                                node.count++;
                                node.size += k.size;
                            }
                            node.keys.push(k);
                        }
                        const autoOpen =
                            S.k.pattern !== '*' && list.length <= 60;
                        const walk = (node, depth) => {
                            [...node.kids.values()]
                                .sort((a, b) => coll.compare(a.name, b.name))
                                .forEach((f) => {
                                    const open =
                                        autoOpen || S.k.open.has(f.path);
                                    out.push(
                                        `<button class="frow ${open ? 'open' : ''}" data-action="folder" data-path="${esc(f.path)}" aria-expanded="${open}" style="padding-left:${16 + depth * 18}px">${I.chev}${I.folder}<span class="nm">${hl(f.name)}</span><span class="mono xs mu">${fmtNum(f.count)}</span><span class="kv c-size mu">${fmtBytes(f.size)}</span></button>`
                                    );
                                    if (open) walk(f, depth + 1);
                                });
                            const lim = S.k.limit[node.path || ''] || 200;
                            node.keys
                                .sort((a, b) => coll.compare(a.name, b.name))
                                .slice(0, lim)
                                .forEach((k) => {
                                    const leaf = k.name.split(':').pop();
                                    out.push(
                                        keyRow(
                                            k,
                                            depth ? depth * 18 + 4 : 0,
                                            depth ? leaf : k.name,
                                            ''
                                        )
                                    );
                                });
                            if (node.keys.length > lim)
                                out.push(
                                    `<div class="morerow" style="padding-left:${depth * 18 + 40}px">${fmtNum(node.keys.length - lim)} more in this folder<button class="btn xs" data-action="more" data-path="${esc(node.path || '')}">Load next 500</button></div>`
                                );
                        };
                        walk(root, 0);

                    el.innerHTML = out.join('');
                    renderSelBar();

    <button class="btn sm danger" data-action="sel-delete" ${isRO() ? 'disabled' : ''}>${I.trash}Delete…</button></div>`

                        body = `<table class="vtable"><thead><tr><th scope="col" style="width:30%">Field</th><th scope="col">Value</th><th scope="col" style="width:64px">Size</th></tr></thead><tbody>
      ${rows

          })

      ${rows.length ? '' : `<tr><td colspan="3" class="mu" style="font-family:var(--f-ui)">No fields match “${esc(S.k.ffilter)}”</td></tr>`}</tbody></table>`;
                        item = item ? { label: item[0], value: item[1] } : null;
                    } else if (k.type === 'list') {

                            .map((v, i) => ({ v, i }))

                        tools = `<label class="search">${I.search}<span class="sr">Filter items</span><input id="ff" type="text" placeholder="Filter loaded items" value="${esc(S.k.ffilter)}"></label><span class="sm mu">LRANGE 0 ${k.value.length - 1} of ${fmtNum(lenOf(k))}</span>`;
                        body = `<table class="vtable"><thead><tr><th scope="col" style="width:56px">Index</th><th scope="col">Value</th><th scope="col" style="width:64px">Size</th></tr></thead><tbody>
      ${rows.map(({ v, i }) => `<tr class="pick ${S.k.item === i ? 'on' : ''}" data-action="item" data-i="${i}" tabindex="0"><td class="mu">${i}</td><td class="val"><span class="fmt">json</span>${esc(v)}</td><td class="mu" style="font-size:11.5px">${fmtBytes(v.length)}</td></tr>`).join('')}</tbody></table>`;
                        const it = k.value[S.k.item] || k.value[0];
                        item = {

                    } else if (k.type === 'zset') {
                        body = `<table class="vtable"><thead><tr><th scope="col">Member</th><th scope="col" style="width:44%">Score</th></tr></thead><tbody>
      ${k.value.map(([m, sc], i) => `<tr class="pick ${S.k.item === i ? 'on' : ''}" data-action="item" data-i="${i}" tabindex="0"><td class="ellip" style="max-width:0">${esc(m)}</td><td style="white-space:nowrap"><span class="n" style="color:var(--num)">${sc}</span><span class="hintx">${fmtDate(sc)}</span></td></tr>`).join('')}</tbody></table>`;
                        tools = `<span class="sm mu">ZRANGE 0 -1 WITHSCORES · ${k.value.length} members</span>`;
                    } else {

                    }
                    const insp = item
                        ? inspector(
                              item.label,

                          )
                        : '';
                    el.innerHTML = `
    <div class="dhead">
      <div class="dtitle">
        <span class="badge auto b-${k.type}">${k.type}</span>
        <h2 title="${esc(k.name)}"><span class="mu">${esc(cut >= 0 ? k.name.slice(0, cut + 1) : '')}</span>${esc(cut >= 0 ? k.name.slice(cut + 1) : k.name)}</h2>
        <button class="iconbtn" data-action="key-copy" aria-label="Copy key name" title="Copy key name">${I.copy}</button>
        <button class="iconbtn" data-action="key-rename" aria-label="Rename key" title="Rename" ${ro ? 'disabled' : ''}>${I.pencil}</button>
        <button class="iconbtn" data-action="key-refresh" aria-label="Reload value" title="Reload">${I.refresh}</button>
        <button class="iconbtn danger" data-action="key-delete" aria-label="Delete key" title="Delete" ${ro ? 'disabled' : ''}>${I.trash}</button>
      </div>
      <dl class="meta">
        <div><dt>TTL ${ro ? '' : `<button data-action="key-ttl" aria-label="Edit TTL" title="Edit TTL">${I.pencil}</button>`}</dt><dd id="dttl">${fmtTTL(k.exp)}</dd></div>
        <div><dt>Memory</dt><dd>${fmtBytes(k.size)}</dd></div>
        <div><dt>Encoding</dt><dd>${encOf(k)}</dd></div>
        <div><dt>${lenLabel}</dt><dd>${fmtNum(lenOf(k))}</dd></div>
        <div><dt>Idle</dt><dd>${idleOf(k)}</dd></div>
      </dl>
    </div>
    ${tools ? `<div class="dtools">${tools}</div>` : ''}
    <div class="scroll">${body}${insp}</div>`;
                }
                function inspector(label, value, editable) {
                    const det = detectFmt(value);
                    const mode = S.k.fmt === 'auto' ? det : S.k.fmt;

                /* ================= STATS ================= */
                const RANGES = {
                    '15m': { n: 45, step: 20 },
                    '1h': { n: 60, step: 60 },
                    '6h': { n: 72, step: 300 },
                    '24h': { n: 96, step: 900 },
                    '7d': { n: 84, step: 7200 },
                    '30d': { n: 90, step: 28800 }
                };
                let MEM = null;
                function genMem() {
                    const cfg = RANGES[S.st.range],
                        r = mulberry32(hashStr(S.st.range)),
                        n = cfg.n;
                    const used = [],
                        rss = [],
                        peak = [];
                    let pk = 2.55;
                    for (let i = 0; i < n; i++) {
                        const u =
                            2.25 +
                            0.22 * Math.sin((i / n) * Math.PI * 3) +
                            0.06 * (r() - 0.5) +
                            (i > n * 0.62 && i < n * 0.72 ? 0.32 : 0);
                        used.push(u);
                        pk = Math.max(pk, u);
                        peak.push(pk);
                        rss.push(Math.max(u * 2.8, 6.4) + 0.18 * (r() - 0.5));
                    }
                    MEM = {
                        n,
                        step: cfg.step,
                        t0: Date.now() - (n - 1) * cfg.step * 1000,
                        used,
                        rss,
                        peak
                    };
                }
                const TILES = [
                    {
                        id: 'ops',
                        title: 'Ops / sec',
                        unit: '',
                        src: 'instantaneous_ops_per_sec',

                    },

                        fmt: (v) => fmtNum(Math.round(v)),

                            fmtNum(S.keys.filter((k) => k.exp != null).length) +
                            ' with TTL'
                    }
                ];
                const SER = {};
                TILES.forEach((t) => {
                    const r = mulberry32(hashStr(t.id));
                    SER[t.id] = Array.from(
                        { length: 30 },
                        (_, i) =>
                            t.base +
                            t.amp *
                                (Math.sin(i * 0.55 + r() * 6) * 0.6 +
                                    (r() - 0.5) * 0.8)

                });
                function spark(vals, w = 200, h = 32, thr = null) {
                    const lo = Math.min(...vals, thr ?? Infinity),
                        hi = Math.max(...vals, thr ?? -Infinity),
                        pad = (hi - lo) * 0.15 || 1;
                    const y = (v) =>
                        (
                            h -
                            ((v - (lo - pad)) / (hi + pad - (lo - pad))) * h

                        .map(
                            (v, i) =>

                }
                function tileState(t, v) {

                            ['cmdstat_hset.calls', 'counter', 25747],
                            ['cmdstat_get.usec_per_call', 'gauge', 2.1]

                const FIELDVAL = {};
                CATALOG.forEach((s) =>

                );
                const FNS = [
                    'rate',
                    'delta',
                    'avg_over',
                    'max_over',
                    'sum_shards',
                    'clamp'
                ];
                function evalExpr(src) {
                    const ids = src.match(/[A-Za-z_][A-Za-z0-9_.|]*/g) || [];
                    for (const id of ids) {
                        if (FNS.includes(id)) continue;
                        if (!(id in FIELDVAL))
                            return {
                                err: `Unknown field “${id}”. Pick it in the list on the left.`
                            };
                        if (!S.w.checked.has(id))
                            return {
                                err: `“${id}” is not selected as an input. Tick it on the left.`
                            };
                        if (typeof FIELDVAL[id] === 'string')
                            return { err: `“${id}” is text, not a number.` };
                    }
                    let depth = 0;
                    for (const ch of src) {
                        if (ch === '(') depth++;
                        if (ch === ')') depth--;
                        if (depth < 0) break;
                    }
                    if (depth !== 0) return { err: 'Brackets do not match.' };
                    if (!src.trim()) return { err: 'Write an expression.' };
                    let js = src.replace(
                        /(rate|delta|avg_over|max_over|sum_shards)\(\s*([A-Za-z_][A-Za-z0-9_.|]*)\s*\)/g,
                        (m, fn, f) => {
                            const v = FIELDVAL[f];
                            return String(fn === 'rate' ? v / 86400 : v);
                        }
                    );
                    js = js.replace(/[A-Za-z_][A-Za-z0-9_.|]*/g, (m) =>
                        m === 'clamp'
                            ? '__c'
                            : m in FIELDVAL
                              ? String(FIELDVAL[m])
                              : m
                    );
                    if (!/^[\d\s+\-*/().,e_c]*$/.test(js.replace(/__c/g, '')))
                        return {
                            err: 'Only numbers, fields, + − × ÷ and the listed functions are allowed.'
                        };
                    try {
                        const v = Function(
                            '__c',
                            '"use strict";return (' + js + ')'
                        )((x, a, b) => Math.min(Math.max(x, a), b));
                        if (typeof v !== 'number' || !isFinite(v))
                            return {
                                err: 'The result is not a finite number (division by zero?).'
                            };
                        return { v };
                    } catch (e) {
                        return {
                            err: 'Syntax error: check operators and commas.'
                        };
                    }
                }
                const unitLabel = (u) =>
                    ({
                        percent: '%',
                        bytes: '',

                function fmtVal(v, u) {

                function wfRecord(ok, text, inputs) {

                function wfExecute() {

                        first.length > 12 ? first.slice(0, 8) + '…' : first;

                        `<div class="scrim" data-action="modal-scrim"><div class="dialog" role="dialog" aria-modal="true" aria-labelledby="mtitle">

    <div class="df"><button type="button" class="btn" data-action="modal-cancel">Cancel</button><button type="submit" class="btn ${o.danger ? 'danger' : 'primary'}" id="mok">${esc(o.ok || 'Confirm')}</button></div></form></div></div>`;
