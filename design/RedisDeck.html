                    } else e.preventDefault();
                });
                const prodGuard = () => (conn().confirm ? conn().name : null);

                /* ================= key actions ================= */
                function deleteKeys(names) {
                    const set = new Set(names);
                    S.keys = S.keys.filter((k) => !set.has(k.name));
                    names.forEach((n) => S.k.sel.delete(n));
                    if (set.has(S.k.active))
                        S.k.active =
                            (S.k.lastMatched || []).find(
                                (k) => !set.has(k.name)
                            )?.name || null;
                }
                function parseTTL(s) {
                    s = s.trim().toLowerCase();
                    if (!s || s === 'none' || s === 'persist') return null;
                    const m = /^(\d+)\s*(s|m|h|d)?$/.exec(s);
                    if (!m) return undefined;
                    return (
                        +m[1] * { s: 1, m: 60, h: 3600, d: 86400 }[m[2] || 's']
                    );
                }

                /* ================= events ================= */
                document.addEventListener('click', (e) => {
                    const t = e.target.closest('[data-action]');
                    if (!t) {
                        if (S.connMenu && !e.target.closest('.connwrap')) {
                            S.connMenu = false;
                            renderSide();
                        }
                        return;
                    }
                    const a = t.dataset.action,
                        d = t.dataset;
                    const k = activeKey();
                    switch (a) {
                        case 'conn-menu':
                            S.connMenu = !S.connMenu;
                            renderSide();
                            break;
                        case 'conn-menu-close':
                            S.connMenu = false;
                            break;
                        case 'conn-switch':
                            S.connId = d.id;
                            S.connMenu = false;
                            S.k.sel.clear();
                            render();
                            toast('Connected to ' + conn().name);
                            break;
                        case 'theme':
                            S.themePref = d.v;
                            applyTheme();
                            render();
                            break;
                        case 'saved': {
                            const s = SAVED[+d.i];
                            S.k.pattern = s.p;
                            S.k.type = 'all';
                            if (S.route !== 'keys') location.hash = 'keys';
                            else render();
                            break;
                        }
                        case 'save-search': {
                            const p = S.k.pattern;
                            if (SAVED.some((s) => s.p === p)) {
                                toast('This search is already saved');
                                break;
                            }
                            modal({
                                title: 'Save search',
                                ok: 'Save',
                                html: `<label class="field">Name<input class="input" id="mname" value="${esc(p.replace(/[*:]+$/, '') || 'All keys')}"></label><span class="sm mu">Pattern <span class="mono">${esc(p)}</span></span>`,
                                onOk: () => {
                                    const n = $('#mname').value.trim();
                                    if (!n) return 'Give it a name';
                                    SAVED.push({ name: n, p });
                                    renderSide();
                                    toast('Saved “' + n + '”');
                                }
                            });
                            break;
                        }
                        case 'type':
                            S.k.type = d.t;
                            document.querySelectorAll('.chip').forEach((c) => {
                                const on = c.dataset.t === d.t;
                                c.classList.toggle('on', on);
                                c.setAttribute('aria-pressed', on);
                            });
                            renderRows();
                            break;
                        case 'view':
                            S.k.view = d.v;
                            document
                                .querySelectorAll('[data-action="view"]')
                                .forEach((b) =>
                                    b.setAttribute(
                                        'aria-pressed',
                                        b.dataset.v === d.v
                                    )
                                );
                            renderRows();
                            break;
                        case 'folder':
                            if (S.k.open.has(d.path)) S.k.open.delete(d.path);
                            else S.k.open.add(d.path);
                            renderRows();
                            break;
                        case 'more':
                            S.k.limit[d.path] =
                                (S.k.limit[d.path] ||
                                    (d.path === '__flat' ? 300 : 200)) +
                                (d.path === '__flat' ? 300 : 500);
                            renderRows();
                            break;
                        case 'clear-search':
                            S.k.pattern = '*';
                            S.k.type = 'all';
                            S.k.ttl = 'any';
                            render();
                            break;
                        case 'pick':
                            S.k.active = d.key;
                            S.k.item = 0;
                            S.k.ffilter = '';
                            document
                                .querySelectorAll('.krow.on')
                                .forEach((r) => r.classList.remove('on'));
                            t.closest('.krow').classList.add('on');
                            renderDetail();
                            break;
                        case 'item':
                            S.k.item = +d.i;
                            renderDetail();
                            break;
                        case 'fmt':
                            S.k.fmt = d.f;
                            renderDetail();
                            break;
                        case 'sel-clear':
                            S.k.sel.clear();
                            renderRows();
                            break;
                        case 'sel-export': {
                            const o = {};
                            S.keys
                                .filter((x) => S.k.sel.has(x.name))
                                .forEach(
                                    (x) =>
                                        (o[x.name] = {
                                            type: x.type,
                                            ttl:
                                                x.exp == null
                                                    ? -1
                                                    : x.exp - nowS(),
                                            value: x.value
                                        })
                                );
                            copyText(
                                JSON.stringify(o, null, 2),
                                `Copied ${S.k.sel.size} keys as JSON`
                            );
                            break;
                        }
                        case 'sel-delete': {
                            const names = [...S.k.sel];
                            modal({
                                title: `Delete ${names.length} key${names.length > 1 ? 's' : ''}?`,
                                ok: 'Delete',
                                danger: true,
                                require:
                                    prodGuard() ||
                                    (names.length > 50 ? 'delete' : null),
                                html: `<div class="sm tx2">This runs <span class="mono">UNLINK</span> on ${esc(conn().name)}. It cannot be undone.</div><div class="codeline" style="max-height:120px;overflow:auto">${names.slice(0, 8).map(esc).join('<br>')}${names.length > 8 ? `<br>… and ${names.length - 8} more` : ''}</div>`,
                                onOk: () => {
                                    deleteKeys(names);
                                    render();
                                    toast(
                                        `Deleted ${names.length} key${names.length > 1 ? 's' : ''}`
                                    );
                                }
                            });
                            break;
                        }
                        case 'sel-ttl':
                        case 'key-ttl': {
                            const names =
                                a === 'sel-ttl' ? [...S.k.sel] : [k.name];
                            modal({
                                title:
                                    names.length > 1
                                        ? `Set TTL on ${names.length} keys`
                                        : 'Set TTL',
                                ok: 'Apply',
                                html: `<label class="field">TTL<input class="input mono" id="mttl" placeholder="e.g. 3600, 30m, 12h, 7d or none"><span class="hint">“none” removes the expiry (PERSIST).</span></label>`,
                                onOk: () => {
                                    const v = parseTTL($('#mttl').value);
                                    if (v === undefined)
                                        return 'Use a number of seconds, or 30m / 12h / 7d, or none';
                                    S.keys.forEach((x) => {
                                        if (names.includes(x.name))
                                            x.exp =
                                                v == null ? null : nowS() + v;
                                    });
                                    render();
                                    toast(
                                        v == null
                                            ? 'Expiry removed'
                                            : `TTL set to ${fmtTTL(nowS() + v)}`
                                    );
                                }
                            });
                            break;
                        }
                        case 'key-copy':
                            copyText(k.name, 'Key name copied');
                            break;
                        case 'val-copy': {
                            const v =
                                k.type === 'string'
                                    ? k.value
                                    : k.type === 'hash'
                                      ? (k.value[S.k.item] || k.value[0])[1]
                                      : k.type === 'list'
                                        ? k.value[S.k.item] || k.value[0]
                                        : '';
                            copyText(v, 'Value copied');
                            break;
                        }
                        case 'key-refresh':
                            renderDetail();
                            toast('Reloaded ' + k.name.split(':').pop());
                            break;
                        case 'key-rename':
                            modal({
                                title: 'Rename key',
                                ok: 'Rename',
                                html: `<label class="field">New name<input class="input mono" id="mren" value="${esc(k.name)}"></label>`,
                                onOk: () => {
                                    const n = $('#mren').value.trim();
                                    if (!n) return 'Enter a name';
                                    if (
                                        n !== k.name &&
                                        S.keys.some((x) => x.name === n)
                                    )
                                        return 'A key with that name already exists';
                                    k.name = n;
                                    S.k.active = n;
                                    render();
                                    toast('Renamed');
                                }
                            });
                            break;
                        case 'key-delete':
                            modal({
                                title: 'Delete key?',
                                ok: 'Delete',
                                danger: true,
                                require: prodGuard(),
                                html: `<div class="codeline">${esc(k.name)}</div><div class="sm tx2">This cannot be undone.</div>`,
                                onOk: () => {
                                    deleteKeys([k.name]);
                                    render();
                                    toast('Key deleted');
                                }
                            });
                            break;
                        case 'val-edit':
                            modal({
                                title: 'Edit value',
                                ok: 'Save',
                                html: `<label class="field">Value<textarea class="textarea mono" id="mval" rows="6">${esc(k.value)}</textarea></label>`,
                                onOk: () => {
                                    k.value = $('#mval').value;
                                    k.size = sizeOf(k);
                                    renderDetail();
                                    renderRows();
                                    toast('Saved');
                                }
                            });
                            break;
                        case 'add-field':
                            modal({
                                title: 'Add field',
                                ok: 'Add',
                                html: `<label class="field">Field<input class="input mono" id="mf"></label><label class="field">Value<textarea class="textarea mono" id="mv" rows="3"></textarea></label>`,
                                onOk: () => {
                                    const f = $('#mf').value.trim();
                                    if (!f) return 'Enter a field name';
                                    if (k.value.some((x) => x[0] === f))
                                        return 'That field already exists';
                                    k.value.push([f, $('#mv').value]);
                                    k.size = sizeOf(k);
                                    S.k.item = k.value.length - 1;
                                    renderDetail();
                                    toast('Field added');
                                }
                            });
                            break;
                        case 'new-key':
                            modal({
                                title: 'New key',
                                ok: 'Create',
                                html: `<label class="field">Key name<input class="input mono" id="mk" placeholder="namespace:id"></label>
        <div class="grid2"><label class="field">Type<select class="select" id="mt"><option>string</option><option>hash</option><option>list</option></select></label><label class="field">TTL<input class="input mono" id="mtt" placeholder="none"></label></div>
        <label class="field">Value<textarea class="textarea mono" id="mv" rows="3" placeholder="For a hash: field=value, one per line. For a list: one item per line."></textarea></label>`,
                                onOk: () => {
                                    const n = $('#mk').value.trim(),
                                        ty = $('#mt').value,
                                        raw = $('#mv').value,
                                        ttl = parseTTL($('#mtt').value);
                                    if (!n) return 'Enter a key name';
                                    if (S.keys.some((x) => x.name === n))
                                        return 'A key with that name already exists';
                                    if (ttl === undefined)
                                        return 'TTL: seconds, 30m / 12h / 7d, or none';
                                    let v = raw;
                                    if (ty === 'hash') {
                                        v = raw
                                            .split('\n')
                                            .filter(Boolean)
                                            .map((l) => {
                                                const i = l.indexOf('=');
                                                return i > 0
                                                    ? [
                                                          l.slice(0, i).trim(),
                                                          l.slice(i + 1)
                                                      ]
                                                    : [l.trim(), ''];
                                            });
                                        if (!v.length)
                                            return 'Add at least one field=value line';
                                    }
                                    if (ty === 'list') {
                                        v = raw.split('\n').filter(Boolean);
                                        if (!v.length)
                                            return 'Add at least one item';
                                    }
                                    const nk = {
                                        name: n,
                                        type: ty,
                                        exp: ttl == null ? null : nowS() + ttl,
                                        value: v
                                    };
                                    nk.size = sizeOf(nk);
                                    S.keys.push(nk);
                                    S.k.active = n;
                                    S.k.item = 0;
                                    render();
                                    toast('Created ' + n);
                                }
                            });
                            break;
                        case 'board':
                            S.st.board = d.id;
                            S.st.edit = false;
                            if (S.route !== 'stats') location.hash = 'stats';
                            else render();
                            break;
                        case 'range':
                            S.st.range = d.r;
                            genMem();
                            render();
                            break;
                        case 'live':
                            S.st.live = !S.st.live;
                            render();
                            break;
                        case 'edit-layout':
                            S.st.edit = !S.st.edit;
                            render();
                            break;
                        case 'rm-widget':
                            (S.st.hidden[S.st.board] =
                                S.st.hidden[S.st.board] || new Set()).add(d.w);
                            render();
                            break;
                        case 'rm-custom':
                            S.st.custom.splice(+d.i, 1);
                            render();
                            break;
                        case 'reset-layout':
                            S.st.hidden[S.st.board] = new Set();
                            render();
                            break;
                        case 'latency-on':
                            S.st.latency = true;
                            render();
                            toast('latency-monitor-threshold set to 100');
                            break;
                        case 'latency-off':
                            S.st.latency = false;
                            render();
                            break;
                        case 'resample':
                            S.st.resampling = true;
                            render();
                            setTimeout(() => {
                                S.st.resampling = false;
                                S.st.sampleAt = nowS();
                                if (S.route === 'stats') render();
                                toast(`Sampled ${fmtNum(S.keys.length)} keys`);
                            }, 900);
                            break;
                        case 'goto-pattern':
                            S.k.pattern = d.p;
                            S.k.type = 'all';
                            location.hash = 'keys';
                            break;
                        case 'goto-key':
                            S.k.pattern = d.key;
                            S.k.active = d.key;
                            S.k.type = 'all';
                            S.k.item = 0;
                            location.hash = 'keys';
                            break;
                        case 'w-viz':
                            S.w.viz = d.v;
                            document
                                .querySelectorAll('.viz')
                                .forEach((b) =>
                                    b.setAttribute(
                                        'aria-checked',
                                        b.dataset.v === d.v
                                    )
                                );
                            renderWPreview();
                            break;
                        case 'w-sec':
                            if (S.w.open.has(d.s)) S.w.open.delete(d.s);
                            else S.w.open.add(d.s);
                            renderWFields();
                            break;
                        case 'w-fn': {
                            const ta = $('#wexpr'),
                                s = ta.selectionStart,
                                en = ta.selectionEnd,
                                sel = ta.value.slice(s, en);
                            const ins = d.f + '(' + sel + ')';
                            ta.setRangeText(ins, s, en, 'end');
                            if (!sel)
                                ta.setSelectionRange(
                                    s + d.f.length + 1,
                                    s + d.f.length + 1
                                );
                            ta.focus();
                            S.w.expr = ta.value;
                            renderWPreview();
                            break;
                        }
                        case 'w-copy':
                            copyText(
                                $('#wjson').textContent,
                                'Widget JSON copied'
                            );
                            break;
                        case 'w-add': {
                            const r = evalExpr(S.w.expr);
                            if (r.err) break;
                            S.st.custom.push({
                                title: S.w.title,
                                unit: S.w.unit,
                                expr: S.w.expr,
                                warn: S.w.warn,
                                crit: S.w.crit,
                                base: r.v,
                                amp: Math.abs(r.v) * 0.03 || 1,
                                series: widgetSeries(r.v).slice(-30)
                            });
                            S.st.board = 'overview';
                            location.hash = 'stats';
                            toast(`Added “${S.w.title}” to Overview`);
                            break;
                        }
                        case 'wf-action':
                            if (S.wf.action !== d.id) {
                                S.wf.action = d.id;
                                S.wf.values = {};
                                S.wf.errors = {};
                                S.wf.plan = null;
                                S.wf.result = null;
                            }
                            if (S.route === 'workflows') render();
                            break;
                        case 'wf-dry': {
                            const ac = ACTIONS[S.wf.action];
                            S.wf.errors = validate(ac);
                            S.wf.result = null;
                            if (Object.keys(S.wf.errors).length) {
                                S.wf.plan = null;
                                render();
                                break;
                            }
                            S.wf.plan = planFor(ac);
                            S.wf.planAt = new Date().toLocaleTimeString(
                                'en-GB'
                            );
                            S.wf.planMs = 40 + Math.floor(Math.random() * 60);
                            wfRecordDry();
                            render();
                            break;
                        }
                        case 'wf-run': {
                            const ac = ACTIONS[S.wf.action];
                            S.wf.errors = validate(ac);
                            if (Object.keys(S.wf.errors).length) {
                                render();
                                break;
                            }
                            if (ac.writes && conn().confirm)
                                modal({
                                    title: `Run “${ac.title}” on ${conn().name}?`,
                                    ok: 'Run',
                                    danger: conn().env === 'production',
                                    require: conn().name,
                                    html: `<div class="sm tx2">This workflow writes to Redis. Run a dry run first if you are unsure what it changes.</div>`,
                                    onOk: () => {
                                        wfExecute();
                                    }
                                });
                            else wfExecute();
                            break;
                        }
                        case 'wf-manifest': {
                            const ac = ACTIONS[S.wf.action];
                            const man = {
                                id: ac.plugin.id,
                                version: ac.plugin.version,
                                actions: [
                                    {
                                        id: ac.id,
                                        title: ac.title,
                                        writes: ac.writes,
                                        inputs: ac.inputs.map((f) => {
                                            const o = {
                                                name: f.name,
                                                label: f.label,
                                                type: f.type
                                            };
                                            if (f.required) o.required = true;
                                            if (f.def) o.default = f.def;
                                            if (f.options)
                                                o.options = f.options;
                                            return o;
                                        })
                                    }
                                ]
                            };
                            modal({
                                title: 'plugin.json',
                                ok: 'Close',
                                html: `<pre class="codebox" style="max-height:340px">${esc(JSON.stringify(man, null, 2))}</pre><span class="sm mu">RedisDeck builds the form, validation and dry run from this manifest.</span>`,
                                onOk: () => {}
                            });
                            break;
                        }
                        case 'copy-res':
                            copyText(S.wf.result.copy, 'ssoId copied');
                            break;
                        case 'c-row':
                            S.c.edit = d.id;
                            S.c.draft = draftFrom(
                                S.conns.find((c) => c.id === d.id)
                            );
                            S.c.test = null;
                            S.c.err = null;
                            render();
                            break;
                        case 'c-new':
                            S.c.edit = null;
                            S.c.draft = blankDraft();
                            S.c.test = null;
                            S.c.err = null;
                            render();
                            break;
                        case 'c-close':
                            S.c.edit = null;
                            S.c.draft = null;
                            S.c.test = null;
                            render();
                            break;
                        case 'c-env':
                            S.c.draft.env = d.v;
                            if (d.v === 'production') {
                                S.c.draft.readOnly = true;
                                S.c.draft.confirm = true;
                            }
                            render();
                            break;
                        case 'c-test':
                            testConn(S.c.draft, 'c');
                            break;
                        case 'c-save': {
                            const o = saveConn(S.c.draft, 'c');
                            if (o) {
                                S.c.edit = o.id;
                                S.c.draft = draftFrom(o);
                                render();
                                toast('Saved ' + o.name);
                            }
                            break;
                        }
                        case 'c-delete': {
                            const c = S.conns.find(
                                (x) => x.id === S.c.draft.id
                            );
                            modal({
                                title: `Delete ${c.name}?`,
                                ok: 'Delete',
                                danger: true,
                                require: c.env === 'production' ? c.name : null,
                                html: `<div class="sm tx2">Removes the saved connection from RedisDeck. Nothing on the Redis server changes.</div>`,
                                onOk: () => {
                                    S.conns = S.conns.filter(
                                        (x) => x.id !== c.id
                                    );
                                    if (S.connId === c.id && S.conns.length)
                                        S.connId = S.conns[0].id;
                                    S.c.edit = null;
                                    S.c.draft = null;
                                    toast('Deleted ' + c.name);
                                    if (!S.conns.length)
                                        location.hash = 'welcome';
                                    else render();
                                }
                            });
                            break;
                        }
                        case 'wl-uri': {
                            const u = $('#wl-uri').value;
                            S.wl.draft.uri = u;
                            if (!u.trim()) {
                                S.wl.uriErr =
                                    'Paste a redis:// or rediss:// URI first.';
                                render();
                                break;
                            }
                            if (!parseUri(u, S.wl.draft)) {
                                S.wl.uriErr =
                                    'That does not look like redis://host:port or rediss://host:port.';
                                render();
                                break;
                            }
                            S.wl.uriErr = null;
                            S.wl.test = null;
                            render();
                            break;
                        }
                        case 'wl-env':
                            S.wl.draft.env = d.v;
                            render();
                            break;
                        case 'wl-test':
                            testConn(S.wl.draft, 'wl');
                            break;
                        case 'wl-save': {
                            const o = saveConn(S.wl.draft, 'wl');
                            if (o) {
                                S.connId = o.id;
                                S.wl.draft = {
                                    name: '',
                                    env: 'local',
                                    host: '',
                                    port: '6379',
                                    user: '',
                                    pass: '',
                                    uri: ''
                                };
                                S.wl.test = null;
                                location.hash = 'keys';
                                toast('Connected to ' + o.name);
                            }
                            break;
                        }
                        case 'wl-import':
                            modal({
                                title: 'Import connections',
                                ok: 'Import',
                                html: `<label class="field">Paste JSON<textarea class="textarea mono" id="mjson" rows="6" placeholder='[{"name":"staging","host":"10.0.0.5","port":6379}]'></textarea></label>`,
                                onOk: () => {
                                    let arr;
                                    try {
                                        arr = JSON.parse($('#mjson').value);
                                    } catch (e) {
                                        return 'That is not valid JSON.';
                                    }
                                    if (!Array.isArray(arr)) arr = [arr];
                                    let n = 0;
                                    arr.forEach((x) => {
                                        if (
                                            x &&
                                            x.host &&
                                            x.name &&
                                            !S.conns.some(
                                                (c) => c.name === x.name
                                            )
                                        ) {
                                            S.conns.push({
                                                id: 'c' + Date.now() + n,
                                                name: String(x.name),
                                                env: x.env || 'local',
                                                host: String(x.host),
                                                port: +x.port || 6379,
                                                db: +x.db || 0,
                                                user: x.user || '',
                                                pass: '',
                                                tls: !!x.tls,
                                                verify: true,
                                                cluster: !!x.cluster,
                                                readOnly:
                                                    x.env === 'production',
                                                confirm: x.env !== 'local',
                                                server: 'Redis · not tested',
                                                ping: 1
                                            });
                                            n++;
                                        }
                                    });
                                    if (!n)
                                        return 'No new connections found. Each needs a unique "name" and a "host".';
                                    toast(
                                        `Imported ${n} connection${n > 1 ? 's' : ''}`
                                    );
                                    render();
                                }
                            });
                            break;
                        case 'wl-env-help':
                            modal({
                                title: 'Configure by environment',
                                ok: 'Close',
                                html: `<span class="sm tx2">Set this on the RedisDeck container. Connections defined here appear on start and cannot be edited in the UI.</span><pre class="codebox">REDISDECK_CONNECTIONS='[
  {"name":"local","url":"redis://host.docker.internal:6379/0"},
  {"name":"prod","url":"rediss://default:…@prod:6380/0",
   "env":"production","readOnly":true}
]'</pre>`,
                                onOk: () => {}
                            });
                            break;
                        case 'modal-cancel':
                            closeModal();
                            break;
                        case 'modal-scrim':
                            if (e.target === t) closeModal();
                            break;
                    }
                });
                function wfRecordDry() {
                    /* dry runs are shown in the panel, not added to history */
                }

                document.addEventListener('change', (e) => {
                    const t = e.target;
                    if (t.classList.contains('ksel')) {
                        if (t.checked) S.k.sel.add(t.dataset.key);
                        else S.k.sel.delete(t.dataset.key);
                        renderSelBar();
                    } else if (t.id === 'selall') {
                        (S.k.lastMatched || []).forEach((k) =>
                            t.checked
                                ? S.k.sel.add(k.name)
                                : S.k.sel.delete(k.name)
                        );
                        renderRows();
                    } else if (t.id === 'ttlf') {
                        S.k.ttl = t.value;
                        renderRows();
                    } else if (t.id === 'hideown') {
                        S.st.hideOwn = t.checked;
                        render();
                    } else if (t.classList.contains('wfield')) {
                        if (t.checked) S.w.checked.add(t.dataset.f);
                        else S.w.checked.delete(t.dataset.f);
                        renderWFields();
                        renderWPreview();
                    } else if (t.id === 'wunit') {
                        S.w.unit = t.value;
                        renderWPreview();
                    } else if (
                        t.classList.contains('cin') ||
                        t.classList.contains('wlin')
                    ) {
                        const key = t.classList.contains('cin') ? 'c' : 'wl',
                            d = key === 'c' ? S.c.draft : S.wl.draft;
                        if (t.type === 'checkbox') d[t.dataset.n] = t.checked;
                        if (t.dataset.n === 'uri' && key === 'c') {
                            if (t.value.trim() && parseUri(t.value, d)) {
                                S.c.test = null;
                                render();
                            }
                        }
                    } else if (
                        t.classList.contains('wfin') &&
                        t.tagName === 'SELECT'
                    )
                        S.wf.values[t.dataset.n] = t.value;
                });
                document.addEventListener('input', (e) => {
                    const t = e.target;
                    if (t.id === 'q') {
                        S.k.pattern = t.value || '*';
                        S.k.sel.clear();
                        renderRows();
                    } else if (t.id === 'ff') {
                        S.k.ffilter = t.value;
                        const pos = t.selectionStart;
                        renderDetail();
                        const n = $('#ff');
                        if (n) {
                            n.focus();
                            n.setSelectionRange(pos, pos);
                        }
                    } else if (t.id === 'wfilter') {
                        S.w.filter = t.value;
                        renderWFields();
                    } else if (t.id === 'wexpr') {
                        S.w.expr = t.value;
                        renderWPreview();
                    } else if (t.id === 'wtitle') {
                        S.w.title = t.value;
                        renderWPreview();
                    } else if (t.id === 'wwarn') {
                        S.w.warn = t.value;
                        renderWPreview();
                    } else if (t.id === 'wcrit') {
                        S.w.crit = t.value;
                        renderWPreview();
                    } else if (t.classList.contains('wfin')) {
                        S.wf.values[t.dataset.n] = t.value;
                    } else if (
                        t.classList.contains('cin') &&
                        t.type !== 'checkbox'
                    ) {
                        S.c.draft[t.dataset.n] = t.value;
                    } else if (
                        t.classList.contains('wlin') &&
                        t.type !== 'checkbox'
                    ) {
                        S.wl.draft[t.dataset.n] = t.value;
                    } else if (t.id === 'wl-uri') {
                        S.wl.draft.uri = t.value;
                    }
                });
                document.addEventListener('keydown', (e) => {
                    if (e.key === 'Escape') {
                        if (MODAL) closeModal();
                        else if (S.connMenu) {
                            S.connMenu = false;
                            renderSide();
                        }
                    } else if (
                        e.key === '/' &&
                        S.route === 'keys' &&
                        !/INPUT|TEXTAREA|SELECT/.test(
                            document.activeElement.tagName
                        ) &&
                        !MODAL
                    ) {
                        e.preventDefault();
                        const q = $('#q');
                        q.focus();
                        q.select();
                    } else if (
                        (e.key === 'Enter' || e.key === ' ') &&
                        document.activeElement &&
                        document.activeElement.matches('tr[data-action]')
                    ) {
                        e.preventDefault();
                        document.activeElement.click();
                    }
                });
                window.addEventListener('hashchange', route);
                const mq = window.matchMedia
                    ? window.matchMedia('(prefers-color-scheme: dark)')
                    : null;
                applyTheme();
                route();
            })();
        </script>
    </body>
</html>
