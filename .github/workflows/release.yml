name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version bump (patch | minor | major) or exact version (e.g. 1.2.3)'
        required: true
        default: patch

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: yarn

      - run: yarn install --frozen-lockfile

      - run: yarn lint

      - run: yarn test

      - name: Bump version & tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          npm version ${{ github.event.inputs.version }} -m "chore: release v%s"
          git push --follow-tags

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          gh release create "v${VERSION}" \
            --title "v${VERSION}" \
            --generate-notes

      - name: Expose version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

  installers:
    needs: release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14 # Apple Silicon (arm64)
            arch: arm64
          - runner: macos-15-intel # Intel (x64); macos-13 is retired by GitHub
            arch: x64
          # ubuntu-22.04 (glibc 2.35) rather than latest, so the AppImage runs on older distros.
          - runner: ubuntu-22.04
            arch: x64
    runs-on: ${{ matrix.runner }}
    env:
      VERSION: ${{ needs.release.outputs.version }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.release.outputs.version }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: yarn

      - run: yarn install --frozen-lockfile

      - name: Install redis-cli build deps (macOS)
        if: runner.os == 'macOS'
        run: brew install openssl@3

      - name: Install redis-cli build deps and xvfb (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev patchelf xvfb libfuse2

      - name: Build installer
        run: yarn electron:build --${{ matrix.arch }}

      - name: Smoke check packaged app
        if: runner.os == 'macOS'
        run: |
          # electron-builder names the x64 dir "mac" and the arm64 dir "mac-arm64".
          APP=$(ls -d dist-electron/mac*/"Redis Deck.app" | head -n 1)
          node scripts/smoke-packaged.js "$APP"

      - name: Smoke check packaged app (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a node scripts/smoke-packaged.js dist-electron/linux-unpacked/redis-deck

      - name: Upload dmg to release
        if: runner.os == 'macOS'
        run: gh release upload "v${VERSION}" dist-electron/*.dmg --clobber

      - name: Upload AppImage to release
        if: runner.os == 'Linux'
        run: gh release upload "v${VERSION}" dist-electron/*.AppImage --clobber
